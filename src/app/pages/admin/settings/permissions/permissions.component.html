<div class="container-fluid">
    <app-page-title title="Gestion des permissions" [breadcrumbItems]="breadCrumbItems"></app-page-title>

    <div class="row">
        <div class="col-12">
          <div class="card">
            <form #addPermissionForm="ngForm" (ngSubmit)="save(addPermissionForm)">
            <div class="card-body">
                <div class="row mb-2">
                  <div class="col-sm-4">
                      <h3>Roles</h3>
                      <select id="roleAgent" #roleAgent name="roleAgent" [(ngModel)]="permissionForm.role" (change)="getMenuByRoles()" class="form-control form-select" required>
                          <option value=""></option>
                          @for(role of roles; track $index) {
                              <option [value]="role.name">{{ role.name }}</option>
                          }
                      </select>
                  </div>
                  <div class="row mb-2 mt-3">
                      <h3>Menus</h3>
                      <hr>
                      @for (menuItem of menus; track $index) {
                      <div class="col-sm-4 col-md-3 col-lg-2">
                              <div class="card border-2">
                                  <div class="card-header text-center">
                                      <h5>{{menuItem.label}}</h5>
                                  </div>
                                  <div class="card-body text-center">
                                      <div class="form-check form-switch form-switch-lg mb-3">
                                          <input type="checkbox" id="flexSwitchCheckChecked{{$index}}" [(ngModel)]="permissionForm.menus[$index].isActive" name="flexSwitchCheckChecked{{$index}}" class="form-control form-check-input">
                                          <label for="flexSwitchCheckChecked{{$index}}" class="form-check-label">
                                              {{permissionForm.menus[$index].isActive ? 'Activé' : 'Désactivé'}}
                                          </label>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      }
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-lg-12 text-center">
                    <button type="submit" [disabled]="!addPermissionForm.form.valid && !loadingBtn"
                      class="btn btn-success btn-lg rounded-2">
                      <i class="fa" [ngClass]="{'fa-spin fa-spinner': loadingBtn, 'fa-check': !loadingBtn}"></i>
                      {{textButton}}
                    </button>
    
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
    </div>
</div>
